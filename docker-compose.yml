services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8787:8787"
    volumes:
      - research_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8787
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  research_uploads:
